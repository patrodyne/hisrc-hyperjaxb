# PostgreSQL: hyperjaxb database on nas02 server.
eclipselink.target-database=org.jvnet.hyperjaxb.opt.eclipselink.database.PostgreSQL10Platform
hibernate.dialect=org.jvnet.hyperjaxb.opt.hibernate.dialect.PostgreSQL13Dialect
jakarta.persistence.jdbc.driver=org.postgresql.Driver
jakarta.persistence.jdbc.user=hyperjaxb
jakarta.persistence.jdbc.password=ChangeMe!
jakarta.persistence.jdbc.url=jdbc:postgresql://nas02/hyperjaxb?escapeSyntaxCallMode=call
jakarta.persistence.schema-generation.create-source=metadata-then-script
jakarta.persistence.schema-generation.create-script-source=file:src/test/resources/persistence-pg.sql
