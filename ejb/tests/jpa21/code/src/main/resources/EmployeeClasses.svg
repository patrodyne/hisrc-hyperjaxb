@startuml

class org.example.jpa21.model.Department {
	{field} +id : Long
	{field} +name : String
}


class org.example.jpa21.model.Employee {
	{field} +active : boolean
	{field} +id : Long
	{field} +lastName : String
}


class org.example.jpa21.model.Project {
	{field} +id : Long
	{field} +projectName : String
}


class org.example.jpa21.other.BooleanConverter {
}


class org.example.jpa21.other.EmployeeSummary {
	{field} -id : Long
	{field} -name : String
}




org.example.jpa21.model.Department "1" o- - "0..*"  org.example.jpa21.model.Employee : employees
org.example.jpa21.model.Employee "1" o- - "0..*"  org.example.jpa21.model.Project : projects
org.example.jpa21.model.Employee - ->  org.example.jpa21.model.Department : department


@enduml

